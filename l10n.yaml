# Configuration for `flutter gen-l10n` (package:flutter_localizations).
#
# Run `flutter gen-l10n` after editing any file in lib/l10n, or just build the
# app — gen-l10n runs automatically as part of the build.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/generated
nullable-getter: false
